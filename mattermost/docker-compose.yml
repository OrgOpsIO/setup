services:
  postgres:
    image: postgres:14-alpine
    container_name: mattermost-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    container_name: mattermost
    restart: always
    environment:
      - MM_USERNAME=${POSTGRES_USER}
      - MM_PASSWORD=${POSTGRES_PASSWORD}
      - MM_DBNAME=${POSTGRES_DB}
      - MM_SQLSETTINGS_DRIVERNAME=postgres
      - MM_SQLSETTINGS_DATASOURCE=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - MM_SERVICESETTINGS_SITEURL=https://${SUBDOMAIN}.${DOMAIN_NAME}
      - MM_SERVICESETTINGS_ENABLEDEVELOPER=false
      - MM_PLUGINSETTINGS_ENABLEUPLOADS=true
    volumes:
      - ./volumes/data:/mattermost/data
      - ./volumes/plugins:/mattermost/plugins
      - ./volumes/client-plugins:/mattermost/client/plugins
      - ./volumes/logs:/mattermost/logs
      - ./volumes/config:/mattermost/config
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mattermost.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)"
      - "traefik.http.routers.mattermost.entrypoints=websecure"
      - "traefik.http.routers.mattermost.tls=true"
      - "traefik.http.routers.mattermost.tls.certresolver=letsencrypt"
      - "traefik.http.services.mattermost.loadbalancer.server.port=8065"
    networks:
      - internal
      - traefik-proxy

networks:
  internal:
    driver: bridge
  traefik-proxy:
    external: true
